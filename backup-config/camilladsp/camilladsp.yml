description: Loopback input -> USB 6ch output ready for crossover
devices:
  adjust_period: 5
  capture:
    channels: 4
    device: mixin
    format: S32LE
    labels: null
    link_mute_control: null
    link_volume_control: null
    stop_on_inactive: null
    type: Alsa
  capture_samplerate: null
  chunksize: 1024
  enable_rate_adjust: true
  multithreaded: null
  playback:
    channels: 6
    device: hw:3,0
    format: S16LE
    type: Alsa
  queuelimit: 3
  rate_measure_interval: 1
  resampler: null
  samplerate: 48000
  silence_threshold: null
  silence_timeout: null
  stop_on_rate_change: false
  target_level: 0
  volume_limit: null
  volume_ramp_time: 0.25
  worker_threads: null
filters:
  av_delay:
    description: null
    parameters:
      delay: 6.5
      subsample: null
      unit: null
    type: Delay
  c_hp120:
    description: null
    parameters:
      freq: 120
      order: 4
      type: LinkwitzRileyHighpass
    type: BiquadCombo
  c_lp7000:
    description: null
    parameters:
      freq: 7000
      order: 4
      type: LinkwitzRileyLowpass
    type: BiquadCombo
  fh_hp300:
    description: null
