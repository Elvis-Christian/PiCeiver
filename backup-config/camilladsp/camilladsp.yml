      freq: 80
      order: 4
      type: LinkwitzRileyLowpass
    type: BiquadCombo
mixers:
  select_source:
    channels:
      in: 4
      out: 2
    description: 'Select TV/Spotify (4ch->2ch). Default: Spotify'
    labels:
    - LEFT
    - RIGHT
    mapping:
    - dest: 0
      mute: false
      sources:
      - channel: 0
        gain: -120
        inverted: false
        mute: false
        scale: dB
      - channel: 2
        gain: 0
        inverted: false
        mute: false
        scale: dB
    - dest: 1
      mute: false
      sources:
      - channel: 1
        gain: -120
        inverted: false
        mute: false
        scale: dB
      - channel: 3
        gain: 0
        inverted: false
        mute: false
        scale: dB
  route_inputs:
    channels:
      in: 2
      out: 6
    description: Main mix
    labels:
    - 'LEFT-H '
    - 'RIGHT-H '
    - CENTER
    - LFE
    - LEFT-L
    - 'RIGHT-L '
    mapping:
    - dest: 0
      mute: false
      sources:
      - channel: 0
        gain: 0
        inverted: false
        mute: false
        scale: dB
    - dest: 1
      mute: false
      sources:
      - channel: 1
        gain: 0
        inverted: false
        mute: false
        scale: dB
    - dest: 4
      mute: false
      sources:
      - channel: 0
        gain: 1
        inverted: false
        mute: false
        scale: dB
    - dest: 5
      mute: false
      sources:
      - channel: 1
        gain: 1
        inverted: false
        mute: false
        scale: dB
    - dest: 3
      mute: false
      sources:
      - channel: 0
        gain: 2
        inverted: null
        mute: null
        scale: dB
      - channel: 1
        gain: 2
        inverted: null
        mute: null
        scale: dB
    - dest: 2
      mute: false
      sources:
      - channel: 0
        gain: 5
        inverted: false
        mute: null
        scale: dB
      - channel: 1
        gain: 5
        inverted: false
        mute: null
        scale: dB
  stereo_widen:
    channels:
      in: 6
      out: 6
    description: Stereo widening apenas em L/R (0/1), passthrough nos demais
    labels: null
    mapping:
    - dest: 0
      mute: null
      sources:
      - channel: 0
        gain: 1.1
        inverted: null
        mute: null
        scale: linear
      - channel: 1
        gain: -0.3
        inverted: null
        mute: null
        scale: linear
    - dest: 1
      mute: null
      sources:
      - channel: 0
        gain: -0.3
        inverted: null
        mute: null
        scale: linear
      - channel: 1
        gain: 1.1
        inverted: null
        mute: null
        scale: linear
    - dest: 2
      mute: null
      sources:
      - channel: 2
        gain: 1
        inverted: null
        mute: null
        scale: linear
    - dest: 3
      mute: null
      sources:
      - channel: 3
        gain: 1
        inverted: null
        mute: null
        scale: linear
    - dest: 4
      mute: null
      sources:
      - channel: 4
        gain: 1
        inverted: null
        mute: null
        scale: linear
    - dest: 5
      mute: null
      sources:
      - channel: 5
        gain: 1
        inverted: null
        mute: null
        scale: linear
