# Default cards
# Keep defaults for other apps
defaults.pcm.card 0
defaults.ctl.card 0

# Playback sources on Loopback device 0
pcm.spotify {
    type plug
    slave.pcm "plughw:Loopback,0,0"
}

pcm.tv {
    type plug
    slave.pcm "plughw:Loopback,0,1"
}

# Capture from Loopback device 1 (paired with device 0)
# 4ch capture: [Spotify L/R, TV L/R]
pcm.mixin_raw {
    type multi
    slaves.a.pcm "plughw:Loopback,1,0"
    slaves.a.channels 2
    slaves.b.pcm "plughw:Loopback,1,1"
    slaves.b.channels 2
    bindings.0.slave a
    bindings.0.channel 0
    bindings.1.slave a
    bindings.1.channel 1
    bindings.2.slave b
    bindings.2.channel 0
    bindings.3.slave b
    bindings.3.channel 1
}

pcm.mixin {
    type plug
    slave.pcm "mixin_raw"
}
